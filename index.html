document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Allianz Technology R&amp;D Hub — Global Network<\u002Ftitle>\n<script src=\"98c8d534-d195-4aee-ac4d-605d9b9495c2\" integrity=\"sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"d9376a5c-2a7a-453a-8b14-732a12441a67\" integrity=\"sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67\" crossorigin=\"anonymous\"><\u002Fscript>\n\n<style>\n@font-face{font-family:\"Allianz Neo\";src:url(\"7c5aead0-121e-42b7-8f12-df931eac9ab6\") format(\"woff2\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Allianz Neo\";src:url(\"ebe31077-07e1-4132-b114-003d7361315c\") format(\"woff2\");font-weight:600;font-style:normal;font-display:swap}\n@font-face{font-family:\"Allianz Neo\";src:url(\"b3fbdd98-59cf-4d29-b945-871afe74656e\") format(\"woff2\");font-weight:700;font-style:normal;font-display:swap}\n\n:root{\n  --blue:#003781;\n  --navy:#122B54;\n  --highlight:#13A0D3;\n  --accent:#F86200;\n  --land:#DCE9F4;\n  --land-active:#B9D3EA;\n  --hairline:#C3D7E9;\n  --surface:#FFFFFF;\n  --subtle:#F0F7FC;\n  --mid:#6590BD;\n  --ease:cubic-bezier(.22,.61,.36,1);\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{\n  font-family:\"Allianz Neo\",-apple-system,\"Segoe UI\",sans-serif;\n  color:var(--navy);\n  background:var(--surface);\n  -webkit-font-smoothing:antialiased;\n}\na{color:var(--blue)}\na:hover{color:var(--highlight)}\n\n.shell{display:flex;flex-direction:column;overflow:hidden}\n\n\n/* The panel is a grid column whose width is a registered custom property, so it\n   interpolates reliably in BOTH directions — the map column takes the remainder,\n   which is what makes the map glide and rescale as one continuous motion.\n   Height is constant (set by render() from the width) so the page never reflows. */\n@property --pw{syntax:\"<length>\";inherits:true;initial-value:0px}\n.stage{\n  display:grid;grid-template-columns:var(--pw) minmax(0,1fr);\n  align-items:stretch;overflow:hidden;height:420px;min-height:0;\n  transition:--pw .8s var(--ease),height .8s var(--ease);\n}\n\n.mapwrap{\n  min-width:0;position:relative;\n  display:flex;align-items:center;justify-content:center;\n  background:\n    radial-gradient(120% 90% at 50% 40%, #FAFCFE 0%, #F2F7FB 100%);\n  overflow:hidden;\n}\n#map{width:100%;height:100%;display:block;touch-action:manipulation}\n.mapwrap{transition:flex-basis .8s var(--ease)}\n\n/* ---- panel ---- */\n.panel{\n  width:100%;min-width:0;overflow:hidden;\n  background:var(--surface);\n  border-right:1px solid transparent;\n  transition:border-color .5s linear;\n}\nbody.open .panel{border-right-color:var(--hairline)}\n\n.panel-inner{\n  height:100%;overflow-y:auto;overscroll-behavior:contain;\n  padding:18px 24px 20px;\n  opacity:0;transform:translateX(-36px);\n  transition:opacity .8s var(--ease),transform .8s var(--ease);\n}\nbody.open .panel-inner{opacity:1;transform:none}\n\n.panel-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}\n.eyebrow{\n  font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;\n  color:var(--accent);margin:0 0 8px;\n}\nh1.place{\n  font-size:clamp(22px,1.8vw,28px);line-height:1.14;font-weight:700;\n  color:var(--blue);margin:0;letter-spacing:-.015em;\n}\n.city{font-size:15px;color:var(--mid);margin:5px 0 0;font-weight:400}\n.rule{height:1px;background:var(--hairline);margin:11px 0 11px;border:0}\n.body p{\n  font-size:16px;line-height:1.55;margin:0 0 12px;color:var(--navy);\n  text-wrap:pretty;\n}\n.body p:last-child{margin-bottom:0}\n\n.links{margin-top:20px;padding-top:16px;border-top:1px solid var(--hairline)}\n.linkrow{\n  font-size:15px;line-height:1.5;margin:0 0 12px;color:var(--navy);\n  display:flex;flex-wrap:wrap;gap:4px;text-wrap:pretty;\n}\n.linkrow:last-child{margin-bottom:0}\na.deeplink{\n  color:var(--blue);font-weight:700;text-decoration:underline;\n  text-decoration-thickness:1px;text-underline-offset:2px;\n  border-radius:4px;transition:color .16s ease;\n}\na.deeplink:hover{color:var(--highlight)}\na.deeplink:focus-visible{outline:2px solid var(--highlight);outline-offset:2px}\n#localrow[hidden]{display:none}\n\n.close{\n  flex:none;width:40px;height:40px;border-radius:4px;\n  border:1px solid var(--hairline);background:#fff;color:var(--blue);\n  cursor:pointer;display:grid;place-items:center;\n  transition:background .16s ease,border-color .16s ease,color .16s ease;\n}\n.close:hover{background:var(--blue);border-color:var(--blue);color:#fff}\n.close:focus-visible{outline:2px solid var(--highlight);outline-offset:2px}\n.close svg{width:16px;height:16px;display:block}\n\n.fade{animation:fadeUp .46s var(--ease) both}\n@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n\n/* ---- map svg bits ---- */\n.pin{cursor:pointer}\n.pin .glyph{transition:transform .22s var(--ease);transform-box:fill-box;transform-origin:50% 100%}\n.pin:hover .glyph{transform:translateY(-4px) scale(1.1)}\n.pin .body{transition:fill .24s ease}\n.pin:hover .body{fill:#0E6BB0}\n.pin.sel .body{fill:var(--accent)}\n.pin .halo{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .3s ease}\n.pin.sel .halo{opacity:1;animation:pulse 2.2s ease-out infinite}\n@keyframes pulse{0%{transform:scale(.5);opacity:.55}70%{transform:scale(2.1);opacity:0}100%{transform:scale(2.1);opacity:0}}\n.pin .lbl{\n  font-size:15px;font-weight:700;fill:var(--blue);\n  paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:4px;stroke-linejoin:round;\n  opacity:0;transition:opacity .24s ease;\n}\n.pin:hover .lbl{opacity:1}\n.pin.sel .lbl{opacity:0;fill:var(--accent)}\n.pin:focus{outline:none}\n.pin:focus-visible .ring{stroke:var(--highlight);stroke-width:2.5}\n.country{transition:fill .5s var(--ease)}\n#lens{opacity:0;transition:opacity .5s var(--ease);pointer-events:none}\n#lens.on{opacity:1}\n#lens .lensGrow{transition:transform .8s var(--ease);filter:drop-shadow(0 10px 24px rgba(18,43,84,.18))}\n#lens .lensLbl{font-size:16px;font-weight:700;fill:var(--blue);\n  paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:4px;stroke-linejoin:round}\n#lens .lensSub{font-size:14px;font-weight:400;fill:var(--mid);\n  paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:4px;stroke-linejoin:round}\n.tether{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 4;opacity:0;transition:opacity .5s var(--ease)}\n.tether.on{opacity:.85}\n\n@media (max-width:900px){\n  .shell{height:auto;overflow:visible}\n  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;overflow:visible;height:auto!important}\n  .mapwrap{min-height:180px}\n  .panel{order:2;width:auto;height:0;border-right:0!important;border-top:1px solid transparent;\n    transition:height .6s var(--ease),border-color .4s linear}\n  body.open .panel{height:auto;width:auto;min-width:0;border-top-color:var(--hairline)}\n  .mapwrap{order:1}\n  .panel-inner{width:100%!important;min-width:0;padding:20px 20px 28px;transform:translateY(12px)}\n  .panel-top{gap:16px}\n  h1.place{font-size:clamp(22px,5.4vw,30px);overflow-wrap:anywhere}\n  .eyebrow{font-size:13px;letter-spacing:.1em;overflow-wrap:anywhere}\n  .city{font-size:16px}\n  .body p{font-size:16px}\n  .linkrow{font-size:16px;margin-bottom:12px}\n  a.deeplink{display:inline-block;padding:6px 0;margin:-6px 0}\n  .close{width:44px;height:44px}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"shell\">\n\n  <div class=\"stage\">\n    <aside class=\"panel\" id=\"panel\" aria-live=\"polite\">\n      <div class=\"panel-inner\">\n        <div class=\"panel-top\">\n          <div>\n            <p class=\"eyebrow\" id=\"eyebrow\">R&amp;D Center<\u002Fp>\n            <h1 class=\"place\" id=\"place\"><\u002Fh1>\n            <p class=\"city\" id=\"city\"><\u002Fp>\n          <\u002Fdiv>\n          <button class=\"close\" id=\"close\" aria-label=\"Close panel\">\n            <svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M1 1l14 14M15 1L1 15\" stroke=\"currentColor\" stroke-width=\"1.8\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <hr class=\"rule\">\n        <div class=\"body\" id=\"copy\"><\u002Fdiv>\n        <div class=\"links\" id=\"links\">\n          <p class=\"linkrow\" id=\"localrow\"><span class=\"ctatext\">Visit the R&amp;D Center here:<\u002Fspan>\n            <a class=\"deeplink\" id=\"locallink\" target=\"_blank\" rel=\"noopener\">Open the center page<\u002Fa>\n          <\u002Fp>\n          <p class=\"linkrow global\">For more information about our R&amp;D Centers, visit the\n            <a class=\"deeplink\" id=\"globallink\" target=\"_blank\" rel=\"noopener\" href=\"https://allianzms.sharepoint.com/:u:/r/sites/de1214-connect-az-technology-innovation/SitePages/Global-Innovation-Hubs.aspx?d=wac60087a674a4bc09d2909f623bc7d28&amp;csf=1&amp;web=1&amp;e=pSXS9u\">Global R&amp;D Center page<\u002Fa>\n          <\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <div class=\"mapwrap\">\n      <svg id=\"map\" role=\"application\" aria-label=\"World map with Allianz Technology R&amp;D Center locations\"><\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst LOCATIONS = [\n  {\n    id:\"nyc\", city:\"New York\", label:\"New York, United States (US)\", country:\"United States of America\",\n    coords:[-74.006,40.7128], anchor:\"end\", dx:-14, dy:5,\n    region:\"North America\", span:24, cta:\"New York\", link:\"https://allianzms.sharepoint.com/sites/de1214-connect-az-technology-north-america/SitePages/R&D-Hub,-Americas.aspx?isSPOFile=1&TeamsCID=efc5aee0-0fe6-49df-bd95-da60220a2372&linkOpenTime=1788247653913&CT=1789651234200&OR=OWA-NT-Mail&CID=be52f635-eac5-1265-05ae-1669df73a2e0&SI=NonSentItems&SLSync=Y\",\n    title:\"Sensing what’s next\",\n    paras:[\n      \"The New York R&D Center helps us identify new signals and opportunities from the wider innovation ecosystem. Drawing on its environment and expertise, it focuses on sensing what’s next, tracking early-stage capital, and identifying emerging developments that could be relevant for Allianz.\"\n    ]\n  },\n  {\n    id:\"pune\", city:\"Pune\", label:\"Pune, India\", country:\"India\",\n    coords:[73.8567,18.5204], anchor:\"start\", dx:14, dy:5,\n    region:\"India\", span:17, cta:\"India\", link:\"https://allianzms.sharepoint.com/sites/de1214-connect-az-technology-innovation/SitePages/India-innovation-hub.aspx\",\n    title:\"Testing and experimenting fast\",\n    paras:[\n      \"The India R&D Center is built for rapid experimentation. Thanks to exceptional talent and proximity to our India delivery hub, it provides an environment where ideas can be explored, tested, and refined quickly in close collaboration with our stakeholders.\"\n    ]\n  },\n  {\n    id:\"muc\", city:\"Munich\", label:\"Munich, Germany\", country:\"Germany\",\n    coords:[11.582,48.1351], anchor:\"start\", dx:14, dy:-14,\n    region:\"Europe\", span:12, cta:\"Munich\",\n    title:\"Scaling proven ideas\",\n    paras:[\n      \"The Munich R&D Center focuses on helping successful ideas grow beyond the experimentation phase. It supports the transition from a proven concept to a broader initiative, translating validated ideas into opportunities that can create value at scale.\"\n    ]\n  }\n];\n\nconst svg = d3.select(\"#map\");\nconst gRoot = svg.append(\"g\").attr(\"id\",\"zoom\");\nconst gLand = gRoot.append(\"g\");\nconst gTether = gRoot.append(\"g\");\nconst gPins = gRoot.append(\"g\");\nconst gLens = svg.append(\"g\").attr(\"id\",\"lens\");\n\nconst projection = d3.geoNaturalEarth1();\nconst path = d3.geoPath(projection);\n\n/* regional projection used inside the detail lens */\nconst lensProj = d3.geoAzimuthalEqualArea();\nconst lensPath = d3.geoPath(lensProj);\n\nlet countries = [];\nlet selected = null;\nlet size = {w:0,h:0};\nlet logical = {w:0,h:0};\n\n/* ---------- data ---------- */\nd3.json(\"https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json\").then(topo=>{\n  countries = topojson.feature(topo, topo.objects.countries).features;\n\n  gLand.selectAll(\"path.country\").data(countries).join(\"path\")\n    .attr(\"class\",\"country\")\n    .attr(\"fill\",\"var(--land)\")\n    .attr(\"stroke\",\"#FFFFFF\").attr(\"stroke-width\",.8)\n    .attr(\"vector-effect\",\"non-scaling-stroke\");\n\n  buildLens();\n  buildPins();\n  paintTries = 0;\n  ensurePainted();\n}).catch(()=>{ /* offline: map data unavailable, pins still render */ buildLens(); buildPins(); render(); });\n\n/* ---------- pins ---------- */\nfunction buildPins(){\n  const g = gPins.selectAll(\"g.pin\").data(LOCATIONS, d=>d.id).join(\"g\")\n    .attr(\"class\",\"pin\")\n    .attr(\"tabindex\",0)\n    .attr(\"role\",\"button\")\n    .attr(\"aria-label\", d=>d.label+\" R&D Center\")\n    .on(\"click\",(e,d)=>select(d.id))\n    .on(\"keydown\",(e,d)=>{ if(e.key===\"Enter\"||e.key===\" \"){e.preventDefault();select(d.id);} });\n\n  const s = g.append(\"g\").attr(\"class\",\"pinScale\");\n  // invisible 48px tap target around the pin head\n  s.append(\"circle\").attr(\"class\",\"hit\").attr(\"cx\",0).attr(\"cy\",-16).attr(\"r\",24)\n    .attr(\"fill\",\"transparent\");\n\n  s.append(\"circle\").attr(\"class\",\"halo\").attr(\"r\",11)\n    .attr(\"fill\",\"none\").attr(\"stroke\",\"var(--accent)\").attr(\"stroke-width\",2);\n\n  const glyph = s.append(\"g\").attr(\"class\",\"glyph\");\n  // teardrop pin, tip at (0,0)\n  glyph.append(\"path\").attr(\"class\",\"body\")\n    .attr(\"d\",\"M0 0c0 0 -11 -13.6 -11 -20.4A11 11 0 0 1 11 -20.4C11 -13.6 0 0 0 0Z\")\n    .attr(\"fill\",\"var(--blue)\");\n  glyph.append(\"circle\").attr(\"class\",\"ring\").attr(\"cx\",0).attr(\"cy\",-20.5).attr(\"r\",4.4)\n    .attr(\"fill\",\"#fff\").attr(\"stroke\",\"none\");\n\n  s.append(\"text\").attr(\"class\",\"lbl\")\n    .attr(\"x\",d=>d.dx).attr(\"y\",d=>d.dy - 18)\n    .attr(\"text-anchor\",d=>d.anchor)\n    .text(d=>d.label);\n}\n\n/* ---------- render ---------- */\nconst stage = document.querySelector(\".stage\");\nconst panelEl = document.getElementById(\"panel\");\nconst panelInner = panelEl.querySelector(\".panel-inner\");\n\nfunction panelTargetW(){\n  const W = stage.clientWidth || document.documentElement.clientWidth;\n  // the map is width-bound in the open state, so every px given back to the map\n  // column enlarges it — trimmed to the narrowest width the copy still fits at\n  // 340px is the narrowest width at which the longest copy still fits without\n  // scrolling — everything above that goes to the (width-bound) map column\n  return Math.round(Math.max(340, Math.min(W * 0.40, 520)));\n}\nfunction setPanelWidth(){\n  if(window.matchMedia(\"(max-width:900px)\").matches){\n    stage.style.removeProperty(\"--pw\"); panelInner.style.width = \"\"; return;\n  }\n  const t = panelTargetW();\n  panelInner.style.width = t + \"px\";\n  stage.style.setProperty(\"--pw\", selected ? t + \"px\" : \"0px\");\n}\n\n/* height the longest-fitting copy needs at the settled panel width */\nlet measureNode = null, needCache = {};\nfunction copyNeed(){\n  const w = panelTargetW() - 15;          // the width the copy really wraps at\n  if(needCache[w]) return needCache[w];\n  if(!measureNode){\n    measureNode = panelInner.cloneNode(true);\n    measureNode.querySelectorAll(\"[id]\").forEach(n=>n.removeAttribute(\"id\"));\n    Object.assign(measureNode.style, {position:\"absolute\", left:\"-99999px\", top:\"0\",\n      height:\"auto\", visibility:\"hidden\", overflow:\"visible\"});\n    panelEl.appendChild(measureNode);\n  }\n  measureNode.style.width = w + \"px\";\n  const place = measureNode.querySelector(\".place\"),\n        city  = measureNode.querySelector(\".city\"),\n        eyeb  = measureNode.querySelector(\".eyebrow\"),\n        body  = measureNode.querySelector(\".body\"),\n        mrow  = measureNode.querySelector(\".linkrow\");\n  let max = 0;\n  LOCATIONS.forEach(l=>{\n    eyeb.textContent = l.label;\n    place.textContent = l.title;\n    city.textContent = \"Allianz Technology R&D Center\";\n    body.innerHTML = \"\";\n    l.paras.forEach(t=>{ const p = document.createElement(\"p\"); p.textContent = t; body.appendChild(p); });\n    if(mrow){ mrow.hidden = !l.link; mrow.querySelector(\".ctatext\").textContent = ctaText(l); }\n    max = Math.max(max, measureNode.scrollHeight);\n  });\n  needCache[w] = max + 10;\n  return needCache[w];\n}\n\nconst isStacked = ()=>window.matchMedia(\"(max-width:900px)\").matches;\n// stacked (phone/tablet): map box matches the world's aspect so it's shown whole, no letterboxing\nfunction ctaText(l){ return \"Visit the R&D Center, \" + l.cta + \" here:\"; }\nfunction closedH(W){ return isStacked() ? Math.round(Math.max(180, W / 1.95)) : Math.round(Math.max(330, Math.min(W / 2.3, 470))); }\nfunction landAspect(){ return landBox && landBox.height ? landBox.width / landBox.height : 1.93; }\n\nfunction sizeStage(){\n  setPanelWidth();\n  const W = stage.clientWidth || document.documentElement.clientWidth;\n  const wrapEl = document.querySelector(\".mapwrap\");\n  if(isStacked()){ stage.style.height = \"\"; wrapEl.style.height = closedH(W) + \"px\"; return; }\n  wrapEl.style.height = \"\";\n  let h = closedH(W);\n  // the map area keeps the same height in both states; it only ever grows if the\n  // copy needs more room (measured at its real wrap width, so nothing scrolls)\n  if(selected) h = Math.min(Math.max(h, copyNeed()), 620);\n  stage.style.height = h + \"px\";\n}\n\nfunction render(){\n  try{ renderBody(); }catch(err){ console.error(\"map render failed\", err); }\n}\n\nfunction renderBody(){\n  sizeStage();\n  const wrap = document.querySelector(\".mapwrap\");\n  const w = wrap.clientWidth, h = wrap.clientHeight;\n  if(!w || !h){ // container not laid out yet (collapsed iframe / hidden embed): keep trying\n    if(retryTimer) clearTimeout(retryTimer);\n    retryTimer = setTimeout(()=>requestAnimationFrame(render), 120);\n    return;\n  }\n  // logical canvas = the closed-state box, so the world view fills it edge to\n  // edge and the open state is the same artwork smoothly scaled down\n  const lw = Math.round(stage.clientWidth || w), lh = closedH(lw);\n  if(lw === logical.w && lh === logical.h && countries.length){ layoutLens(); return; }\n  logical = {w:lw, h:lh};\n  size = {w:lw, h:lh};\n\n  svg.attr(\"preserveAspectRatio\",\"xMidYMid meet\")\n     .attr(\"width\",null).attr(\"height\",null);\n\n  const pad = Math.min(lw,lh)*0.035;\n  projection.fitExtent([[pad,pad],[lw-pad,lh-pad]], {type:\"Sphere\"});\n\n  gLand.selectAll(\"path.country\").attr(\"d\", path);\n  try{ landBox = gLand.node().getBBox(); }catch(e){ landBox = null; }\n\n  gPins.selectAll(\"g.pin\").attr(\"transform\", d=>{\n    const p = projection(d.coords);\n    return `translate(${p[0]},${p[1]})`;\n  });\n  vbNow = null;\n  setVB(selected ? openBox() : closedBox());\n  gPins.selectAll(\"g.pin\").select(\"text.lbl\").each(function(d){\n    const p = projection(d.coords);\n    const est = d.label.length * 7.6;\n    const flip = (d.anchor === \"end\" && p[0] - est < 8) || (d.anchor === \"start\" && p[0] + est > size.w - 8);\n    const anchor = flip ? (d.anchor === \"end\" ? \"start\" : \"end\") : d.anchor;\n    d3.select(this)\n      .attr(\"text-anchor\", anchor)\n      .attr(\"x\", anchor === \"end\" ? -Math.abs(d.dx) : Math.abs(d.dx));\n  });\n\n  layoutLens();\n}\n\n/* ---------- detail lens ----------\n   The world map is always fitted whole inside its container (never cropped);\n   the regional zoom happens inside a circular lens anchored to the selected pin. */\nlet lensR = 0, lensC = {x:0,y:0};\n\nfunction buildLens(){\n  const defs = svg.append(\"defs\");\n  defs.append(\"clipPath\").attr(\"id\",\"lensClip\").append(\"circle\").attr(\"class\",\"lensClipC\");\n\n  const grow = gLens.append(\"g\").attr(\"class\",\"lensGrow\");\n  grow.append(\"circle\").attr(\"class\",\"lensBg\").attr(\"fill\",\"#FFFFFF\");\n  const inner = grow.append(\"g\").attr(\"clip-path\",\"url(#lensClip)\");\n  inner.append(\"rect\").attr(\"class\",\"lensSea\").attr(\"fill\",\"#F2F8FC\");\n  inner.append(\"g\").attr(\"class\",\"lensLand\");\n  inner.append(\"g\").attr(\"class\",\"lensMark\");\n  grow.append(\"circle\").attr(\"class\",\"lensRing\")\n    .attr(\"fill\",\"none\").attr(\"stroke\",\"var(--accent)\").attr(\"stroke-width\",2);\n  grow.append(\"text\").attr(\"class\",\"lensLbl\").attr(\"text-anchor\",\"middle\");\n  grow.append(\"text\").attr(\"class\",\"lensSub\").attr(\"text-anchor\",\"middle\");\n}\n\nfunction layoutLens(){\n  if(!size.w || gLens.select(\".lensGrow\").empty()) return;\n  // phones: skip the detail lens so the map stays fully visible (pin + highlighted country remain)\n  const loc = size.w >= 600 ? selected : null;\n  lensR = Math.max(46, Math.min(Math.min(size.w,size.h)*0.135, 92));\n\n  if(loc){\n    const p = projection(loc.coords);\n    const others = LOCATIONS.filter(l=>l.id!==loc.id).map(l=>projection(l.coords));\n    // every location uses the same offset ring, so the pin → lens relationship reads\n    // identically for New York, Pune and Munich\n    const dist = lensR + 62;          // centre-to-centre distance from the pin\n    const minSep = lensR + 40;        // never allow the lens to crowd the pin\n    // top/bottom margins reserve room for the two caption lines drawn outside the circle\n    const mx = lensR + 12, myTop = lensR + 54, myBot = lensR + 50;\n    let best = null;\n    for(let a=0; a<360; a+=10){\n      const r = a*Math.PI/180;\n      let x = p[0] + Math.cos(r)*dist, y = p[1] + Math.sin(r)*dist;\n      x = Math.max(mx, Math.min(size.w - mx, x));\n      y = Math.max(myTop, Math.min(size.h - myBot, y));\n      const own = Math.hypot(p[0]-x, p[1]-y);\n      const clear = Math.min(...others.map(o=>Math.hypot(o[0]-x,o[1]-y) - lensR - 26));\n      // hard requirement first: enough air between pin and lens\n      const ok = own >= minSep;\n      const score = (ok ? 1000 : own*2) + Math.min(clear, 70)\n                  - Math.abs(own - dist)*0.5 - (a>90&&a<270 ? 0 : 8);\n      if(!best || score > best.score) best = {x,y,score};\n    }\n    lensC = {x:best.x, y:best.y};\n    gLens.attr(\"transform\",`translate(${lensC.x},${lensC.y})`);\n    gLens.select(\".lensGrow\").node().style.transformOrigin =\n      `${p[0]-lensC.x}px ${p[1]-lensC.y}px`;\n\n    svg.select(\".lensClipC\").attr(\"r\", lensR);\n    gLens.select(\".lensBg\").attr(\"r\", lensR);\n    gLens.select(\".lensRing\").attr(\"r\", lensR);\n    gLens.select(\".lensSea\").attr(\"x\",-lensR).attr(\"y\",-lensR).attr(\"width\",lensR*2).attr(\"height\",lensR*2);\n    // labels sit on the far side of the circle from the pin, so they never collide with it\n    const above = lensC.y < p[1] && lensC.y >= lensR + 50;\n    const capW = Math.max(loc.region.length, loc.label.length) * 4.6;\n    const capX = Math.max(capW + 8 - lensC.x, Math.min(size.w - 8 - capW - lensC.x, 0));\n    gLens.select(\".lensLbl\").attr(\"x\", capX).attr(\"y\", above ? -lensR - 26 : lensR + 22).text(loc.region);\n    gLens.select(\".lensSub\").attr(\"x\", capX).attr(\"y\", above ? -lensR - 8 : lensR + 40).text(loc.label);\n\n    // regional geometry, fitted to the lens box\n    lensProj.rotate([-loc.coords[0], -loc.coords[1]]).translate([0,0]).scale(1);\n    const sx = loc.span, sy = loc.span*0.7;\n    const box = {type:\"MultiPoint\", coordinates:[\n      [loc.coords[0]-sx, loc.coords[1]-sy],\n      [loc.coords[0]+sx, loc.coords[1]-sy],\n      [loc.coords[0]+sx, loc.coords[1]+sy],\n      [loc.coords[0]-sx, loc.coords[1]+sy]\n    ]};\n    lensProj.fitExtent([[-lensR,-lensR],[lensR,lensR]], box);\n\n    if(!loc._near){\n      const b = [[loc.coords[0]-sx*1.6, loc.coords[1]-sy*1.6],\n                 [loc.coords[0]+sx*1.6, loc.coords[1]+sy*1.6]];\n      loc._near = countries.filter(c=>{\n        const g = d3.geoBounds(c);\n        return g[0][0] <= b[1][0] && g[1][0] >= b[0][0] &&\n               g[0][1] <= b[1][1] && g[1][1] >= b[0][1];\n      });\n    }\n    gLens.select(\".lensLand\").selectAll(\"path\").data(loc._near).join(\"path\")\n      .attr(\"d\", lensPath)\n      .attr(\"fill\", d => d.properties && d.properties.name === loc.country ? \"var(--land-active)\" : \"var(--land)\")\n      .attr(\"stroke\",\"#FFFFFF\").attr(\"stroke-width\",.9);\n\n    const lp = lensProj(loc.coords);\n    const mark = gLens.select(\".lensMark\").selectAll(\"g\").data([loc]).join(\"g\")\n      .attr(\"transform\",`translate(${lp[0]},${lp[1]})`);\n    mark.selectAll(\"circle.o\").data([0]).join(\"circle\").attr(\"class\",\"o\")\n      .attr(\"r\",8).attr(\"fill\",\"var(--accent)\").attr(\"fill-opacity\",.22);\n    mark.selectAll(\"circle.i\").data([0]).join(\"circle\").attr(\"class\",\"i\")\n      .attr(\"r\",4).attr(\"fill\",\"var(--accent)\").attr(\"stroke\",\"#fff\").attr(\"stroke-width\",1.5);\n\n    // tether from pin to lens edge\n    const ang = Math.atan2(lensC.y - p[1], lensC.x - p[0]);\n    gTether.selectAll(\"line\").data([0]).join(\"line\")\n      .attr(\"class\",\"tether on\")\n      .attr(\"x1\",p[0]).attr(\"y1\",p[1])\n      .attr(\"x2\",lensC.x - Math.cos(ang)*lensR).attr(\"y2\",lensC.y - Math.sin(ang)*lensR);\n  }else{\n    gTether.selectAll(\"line\").attr(\"class\",\"tether\");\n  }\n\n  const on = !!loc;\n  gLens.classed(\"on\", on);\n  gLens.select(\".lensGrow\").node().style.transform = on ? \"scale(1)\" : \"scale(.05)\";\n}\n\nfunction onResize(){ logical = {w:0,h:0}; needCache = {}; render(); }\n\n/* ---------- animated viewBox ---------- */\nlet vbNow = null, vbTimer = null, landBox = null;\n\nfunction closedBox(){ return [0, 0, logical.w, logical.h]; }\nfunction openBox(){\n  if(!landBox) return closedBox();\n  const m = 5;\n  return [landBox.x - m, landBox.y - m, landBox.width + m*2, landBox.height + m*2];\n}\nfunction setVB(b){\n  vbNow = b;\n  svg.attr(\"viewBox\", `${b[0]} ${b[1]} ${b[2]} ${b[3]}`);\n}\nfunction animateVB(){\n  if(!logical.w) return;\n  const to = selected ? openBox() : closedBox();\n  const from = vbNow || closedBox();\n  if(vbTimer) vbTimer.stop();\n  const t0 = performance.now(), dur = 800;\n  vbTimer = d3.timer(()=>{\n    const e = Math.min(1, (performance.now() - t0) / dur);\n    // cubic-bezier(.22,.61,.36,1) ≈ ease-out cubic\n    const k = 1 - Math.pow(1 - e, 3);\n    setVB(from.map((v,i)=> v + (to[i] - v) * k));\n    if(e >= 1){ vbTimer.stop(); vbTimer = null; }\n  });\n  // guarantee the end state even if frames are dropped (throttled/background tab)\n  clearTimeout(animateVB._t);\n  animateVB._t = setTimeout(()=>{\n    if(vbTimer){ vbTimer.stop(); vbTimer = null; }\n    setVB(selected ? openBox() : closedBox());\n  }, dur + 60);\n}\n\n/* ---------- selection ---------- */\nconst panel = document.getElementById(\"panel\");\nfunction select(id){\n  const loc = LOCATIONS.find(l=>l.id===id);\n  if(!loc) return;\n  if(selected && selected.id===id){ deselect(); return; }\n  selected = loc;\n  document.body.classList.add(\"open\");\n\n  document.getElementById(\"eyebrow\").textContent = loc.label;\n  document.getElementById(\"place\").textContent = loc.title;\n  document.getElementById(\"city\").textContent = \"Allianz Technology R&D Center\";\n  const copy = document.getElementById(\"copy\");\n  copy.innerHTML = \"\";\n  loc.paras.forEach((t,i)=>{\n    const p=document.createElement(\"p\");\n    p.textContent=t;\n    p.className=\"fade\";\n    p.style.animationDelay=(0.06*i)+\"s\";\n    copy.appendChild(p);\n  });\n  const inner = panel.querySelector(\".panel-inner\");\n  inner.scrollTop = 0;\n  document.getElementById(\"place\").classList.remove(\"fade\");\n  void document.getElementById(\"place\").offsetWidth;\n  document.getElementById(\"place\").classList.add(\"fade\");\n\n  const localRow = document.getElementById(\"localrow\");\n  const localLink = document.getElementById(\"locallink\");\n  if(loc.link){\n    localLink.href = loc.link;\n    localRow.querySelector(\".ctatext\").textContent = ctaText(loc);\n    localRow.hidden = false;\n  }else{\n    localRow.hidden = true;\n  }\n\n  gPins.selectAll(\"g.pin\").classed(\"sel\", d=>d.id===id);\n  sizeStage();\n  animateVB();\n  // yield one frame so the panel/map animation is already running before the\n  // lens geometry is computed — the transition never stutters\n  requestAnimationFrame(()=>requestAnimationFrame(layoutLens));\n  gLand.selectAll(\"path.country\")\n    .attr(\"fill\", d => d.properties && d.properties.name === loc.country ? \"var(--land-active)\" : \"var(--land)\");\n  render();\n}\n\nfunction deselect(){\n  selected = null;\n  document.body.classList.remove(\"open\");\n  sizeStage();\n  animateVB();\n  gPins.selectAll(\"g.pin\").classed(\"sel\", false);\n  gLand.selectAll(\"path.country\").attr(\"fill\",\"var(--land)\");\n  render();\n}\n\ndocument.getElementById(\"close\").addEventListener(\"click\", deselect);\n\n/* clicking any empty part of the map resets to the full world view */\nsvg.on(\"click\", (e)=>{\n  if(!selected) return;\n  if(e.target.closest && e.target.closest(\".pin\")) return;\n  deselect();\n});\nsvg.node().style.cursor = \"default\";\ndocument.addEventListener(\"keydown\", e=>{ if(e.key===\"Escape\") deselect(); });\n\nlet retryTimer = null;\nlet raf = null;\nnew ResizeObserver(()=>{\n  if(raf) cancelAnimationFrame(raf);\n  raf = requestAnimationFrame(onResize);\n}).observe(document.querySelector(\".shell\"));\n\n/* first paint is verified, not assumed: keep re-rendering until the geometry is\n   actually in the DOM (embedded iframes report unreliable first layout) */\nlet paintTries = 0;\nfunction ensurePainted(){\n  render();\n  const p = document.querySelector(\"#map .country\");\n  const ok = svg.attr(\"viewBox\") && p && p.getAttribute(\"d\");\n  if(!ok && ++paintTries < 60) setTimeout(ensurePainted, 100);\n}\nwindow.addEventListener(\"resize\", onResize);\nwindow.addEventListener(\"load\", onResize);\ndocument.addEventListener(\"visibilitychange\", ()=>{ if(!document.hidden) render(); });\nif(document.fonts && document.fonts.ready) document.fonts.ready.then(onResize);\nensurePainted();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
